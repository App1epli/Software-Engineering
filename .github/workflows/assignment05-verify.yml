name: Assignment 05 Verify
on:
  push:
    branches: [main, 'assignment05/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Application TypeScript check
        run: npm run typecheck
      - name: Test TypeScript check
        run: npm run typecheck:tests
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build
